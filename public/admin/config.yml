locale: zh_Hans
local_backend: true

backend:
  name: github
  repo: ccf-scu/ccfscu-website-source
  branch: main
  base_url: https://ccf-scu-cms-oauth.1632145935.workers.dev
  auth_endpoint: auth
  api_root: https://cms-api.ccfscu.com/github

publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: /uploads
site_url: https://www.ccfscu.com
display_url: /
logo_url: /images/brand/ccf-logo.png

collections:
  - name: activities
    label: 活动内容
    label_singular: 活动
    description: 对应前台“活动”列表、活动详情和首页四个活动方向。
    folder: src/content/activities
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{category}} · {{startAt}}"
    fields:
      - { label: 标题, name: title, widget: string, hint: 用于页面标题和搜索结果 }
      - { label: 摘要, name: summary, widget: text, hint: 建议 60–120 字，用于卡片和分享 }
      - { label: 封面图片 URL, name: cover, widget: external-image, hint: 支持共享图片、HTTPS 图床上传或直接粘贴 URL；建议 3:2 }
      - { label: 封面替代文本, name: coverAlt, widget: string, hint: 描述图片内容，不写“图片”二字 }
      - label: 分类
        name: category
        widget: select
        options:
          - { label: 学术引领, value: academic }
          - { label: 竞赛训练, value: competition }
          - { label: 学业帮扶, value: tutoring }
          - { label: 生涯发展, value: career }
          - { label: 组织建设, value: organization }
      - { label: 开始时间, name: startAt, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: 结束时间, name: endAt, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: 活动中心置顶, name: pinned, widget: boolean, default: false, hint: 仅影响活动中心排序，首页活动由首页设置显式选择 }
      - { label: 归档/下架, name: archived, widget: boolean, default: false, hint: 已发布内容不要删除，使用此开关下架；若它正被首页引用，首页会临时使用同类最新活动，请随后到首页管理确认替代项 }
      - { label: 原始资料链接, name: sourceUrl, widget: string, required: false }
      - { label: 正文, name: body, widget: markdown, hint: Decap 原生 Markdown 编辑器；支持可视化与源码模式，保存为标准 Markdown }

  - name: announcements
    label: 首页公告
    description: 对应首页 NOTICE 公告条；正文预览仅用于检查排版。
    folder: src/content/announcements
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 摘要, name: summary, widget: text }
      - { label: 发布时间, name: publishedAt, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: 失效时间, name: expiresAt, widget: datetime, required: false, format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: 显示, name: visible, widget: boolean, default: true }
      - { label: 链接, name: link, widget: string, required: false, hint: 仅填写站内路径或 HTTPS 地址 }
      - { label: 正文, name: body, widget: markdown, required: false }

  - name: members
    label: 执委成员
    description: 本届成员显示在“关于分会”，全部可见届次自动进入“历史档案”。
    folder: src/content/members
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{cohort}}-{{slug}}"
    fields:
      - { label: 姓名, name: name, widget: string }
      - { label: 职务, name: role, widget: string }
      - { label: 届次, name: cohort, widget: string, hint: 例如“第十五届（2025–2026）” }
      - { label: 显示顺序, name: order, widget: number, value_type: int, default: 0, hint: 数字越小越靠前；成员列表不提供拖动排序。 }
      - { label: 照片 URL, name: photo, widget: external-image, required: false }
      - { label: 照片替代文本, name: photoAlt, widget: string, required: false }
      - { label: 显示, name: visible, widget: boolean, default: true }
      - { label: 简介已获确认, name: profileConfirmed, widget: boolean, default: false }
      - { label: 弹窗个人介绍, name: body, widget: markdown, required: false, hint: 显示在点击执委卡片后打开的介绍框中；支持段落与插入图片，仅在本人或负责人确认后公开 }

  - name: honors
    label: 荣誉记录
    description: 首页显示精选成果，历史档案显示全部可见荣誉。
    folder: src/content/honors
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{year}}-{{slug}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 年份, name: year, widget: number, value_type: int }
      - { label: 图片 URL, name: image, widget: external-image, required: false }
      - { label: 图片替代文本, name: imageAlt, widget: string, required: false }
      - { label: 显示, name: visible, widget: boolean, default: true }

  - name: settings
    label: 页面设置
    description: 按下方页面名称进入设置；指导老师和相关链接均位于“关于分会”。
    delete: false
    files:
      - label: 01 首页｜页面文案
        name: homepage
        file: src/data/homepage.yml
        fields:
          - label: Banner
            name: hero
            widget: object
            fields:
              - { label: 眉题, name: eyebrow, widget: string }
              - { label: 主标题第一行, name: title, widget: string }
              - { label: 主标题第二行, name: titleLineTwo, widget: string }
              - { label: 强调词, name: titleAccent, widget: string, hint: 使用首页蓝色衬线样式显示 }
              - { label: 副标题, name: subtitle, widget: text }
              - { label: 主按钮文字, name: primaryLabel, widget: string }
              - { label: 主按钮链接, name: primaryLink, widget: string }
              - { label: 次按钮文字, name: secondaryLabel, widget: string }
              - { label: 次按钮链接, name: secondaryLink, widget: string }
          - label: 分会简介
            name: introduction
            widget: object
            fields:
              - { label: 标题, name: title, widget: string }
              - { label: 摘要, name: summary, widget: text }
              - { label: 详情入口文字, name: linkLabel, widget: string }
              - { label: 详情入口链接, name: link, widget: string }
              - label: 三项原则
                name: principles
                widget: list
                min: 3
                max: 3
                allow_add: false
                allow_remove: false
                allow_reorder: false
                hint: 固定为三项，只修改每项文案。
                fields:
                  - { label: 英文眉题, name: eyebrow, widget: string }
                  - { label: 中文标题, name: title, widget: string }
                  - { label: 说明, name: summary, widget: text }
              - { label: 引用文字, name: quote, widget: string }
              - { label: 引用署名, name: quoteAttribution, widget: string }
          - label: 活动章节
            name: activities
            widget: object
            fields:
              - { label: 标题, name: title, widget: string }
              - { label: 说明, name: summary, widget: text }
              - label: 四个活动方向
                name: directions
                widget: list
                summary: '{{fields.category}}｜{{fields.title}}｜{{fields.activity}}'
                min: 4
                max: 4
                allow_add: false
                allow_remove: false
                allow_reorder: false
                hint: 四个方向固定；每个方向的文案和代表活动在这里一起维护。
                fields:
                  - { label: 类别, name: category, widget: select, options: [{ label: 学术引领, value: academic }, { label: 竞赛训练, value: competition }, { label: 学业帮扶, value: tutoring }, { label: 生涯发展, value: career }] }
                  - { label: 代表活动, name: activity, widget: relation, collection: activities, search_fields: [title], value_field: '{{slug}}', display_fields: [title], options_length: 100, hint: 请选择与当前方向类别一致且未归档的活动。 }
                  - { label: 英文眉题, name: eyebrow, widget: string }
                  - { label: 中文标题, name: title, widget: string }
                  - { label: 说明, name: summary, widget: text }
          - label: 成果章节
            name: achievements
            widget: object
            fields:
              - { label: 标题, name: title, widget: string }
              - { label: 说明, name: summary, widget: text }
              - { label: 档案标题, name: archiveTitle, widget: string }
              - { label: 档案说明, name: archiveSummary, widget: text }
              - { label: 档案入口文字, name: archiveLinkLabel, widget: string }
              - { label: 档案入口链接, name: archiveLink, widget: string }
              - label: 时间轴
                name: timeline
                widget: list
                min: 1
                allow_add: true
                allow_remove: true
                allow_reorder: true
                hint: 可新增、删除和拖动；列表顺序就是首页时间轴顺序。
                fields:
                  - { label: 年份, name: year, widget: string }
                  - { label: 英文眉题, name: eyebrow, widget: string }
                  - { label: 标题, name: title, widget: string }
                  - { label: 说明, name: summary, widget: text }
          - label: 开源章节
            name: openSource
            widget: object
            fields:
              - { label: 标题, name: title, widget: string }
              - { label: 说明, name: summary, widget: text }
          - label: 招募信息
            name: recruitment
            widget: object
            fields:
              - { label: 状态, name: status, widget: select, options: [{ label: 开放, value: open }, { label: 关闭, value: closed }, { label: 筹备中, value: preparing }] }
              - { label: 标题, name: title, widget: string }
              - { label: 说明, name: summary, widget: text }
              - { label: 主按钮文字, name: primaryLabel, widget: string }
              - { label: 主按钮链接, name: primaryLink, widget: string }
              - { label: 次按钮文字, name: secondaryLabel, widget: string }
              - { label: 次按钮链接, name: secondaryLink, widget: string }
              - label: 加入路径
                name: routes
                widget: list
                min: 3
                max: 3
                allow_add: false
                allow_remove: false
                allow_reorder: false
                hint: 固定为三条路径，只修改每项文案。
                fields:
                  - { label: 标题, name: title, widget: string }
                  - { label: 说明, name: summary, widget: text }
      - label: 01 首页｜公告与荣誉编排
        name: homepageFeatured
        file: src/data/homepage-featured.yml
        fields:
          - label: 首页公告引用
            name: announcements
            widget: list
            min: 1
            max: 10
            hint: 这里只选择已有公告及其显示顺序；公告文案仍在“首页公告”条目中编辑。
            field: { label: 已有公告, name: announcement, widget: relation, collection: announcements, search_fields: [title, summary], value_field: '{{slug}}', display_fields: [title] }
          - label: 首页荣誉引用
            name: honors
            widget: list
            min: 1
            allow_add: true
            allow_remove: true
            hint: 可添加、移除和拖动已有荣誉；这里只选择已有荣誉，拖动顺序就是首页顺序。
            field: { label: 已有荣誉, name: honor, widget: relation, collection: honors, search_fields: [title, year], value_field: '{{slug}}', display_fields: [year, title] }
      - label: 03 关于分会｜分会信息与本届届次
        name: organization
        file: src/data/organization.yml
        fields:
          - { label: 全称, name: name, widget: string }
          - { label: 简称, name: shortName, widget: string }
          - { label: 简介, name: description, widget: text }
          - { label: 成立年份, name: founded, widget: string }
          - { label: 分会序号, name: chapterNumber, widget: string }
          - { label: 本届执委届次, name: currentCohort, widget: string, hint: 必须与成员条目的“届次”完全一致；换届时先新增成员，再在此切换本届 }
      - label: 03 关于分会｜指导老师
        name: teachers
        file: src/data/teachers.yml
        fields:
          - label: 指导老师列表
            name: teachers
            widget: list
            allow_reorder: false
            hint: 以“显示顺序”数字为准，数字越小越靠前。
            fields:
              - { label: 姓名, name: name, widget: string }
              - { label: 职务/职称, name: title, widget: string }
              - { label: 简介, name: summary, widget: text }
              - { label: 照片 URL, name: photo, widget: external-image, required: false }
              - { label: 替代文本, name: photoAlt, widget: string, required: false }
              - { label: 显示顺序, name: order, widget: number, value_type: int, hint: 数字越小越靠前。 }
              - { label: 显示, name: visible, widget: boolean, default: true }
      - label: 03 关于分会｜相关链接
        name: links
        file: src/data/links.yml
        fields:
          - label: 链接列表
            name: links
            widget: list
            allow_reorder: false
            hint: 以“显示顺序”数字为准，数字越小越靠前。
            fields:
              - { label: 名称, name: name, widget: string }
              - { label: 网址, name: url, widget: string, pattern: ['^https?://.+', '请输入以 http:// 或 https:// 开头的完整网址'] }
              - { label: 显示顺序, name: order, widget: number, value_type: int, hint: 数字越小越靠前。 }
              - { label: 显示, name: visible, widget: boolean, default: true }
      - label: 01 首页｜开源按钮
        name: repository
        file: src/data/repository.yml
        fields:
          - { label: 按钮文字, name: label, widget: string }
          - { label: 仓库地址, name: url, widget: string, pattern: ['^https?://.+', '请输入以 http:// 或 https:// 开头的完整网址'] }
          - { label: 显示, name: visible, widget: boolean, default: true }
      - label: 全站｜页脚链接
        name: footerLinks
        file: src/data/footer-links.yml
        fields:
          - label: 页脚链接列表
            name: links
            widget: list
            allow_reorder: false
            hint: 以“显示顺序”数字为准，数字越小越靠前。
            fields:
              - { label: 名称, name: name, widget: string }
              - { label: 网址, name: url, widget: string, pattern: ['^https?://.+', '请输入以 http:// 或 https:// 开头的完整网址'] }
              - { label: 显示顺序, name: order, widget: number, value_type: int, hint: 数字越小越靠前。 }
              - { label: 显示, name: visible, widget: boolean, default: true }
      - label: 全站｜联系方式与 QQ 群
        name: contact
        file: src/data/contact.yml
        fields:
          - label: 联系方式列表
            name: contacts
            widget: list
            allow_reorder: false
            hint: 以“显示顺序”数字为准，数字越小越靠前。
            fields:
              - { label: 标签, name: label, widget: string }
              - { label: 显示值, name: value, widget: string }
              - { label: 链接, name: link, widget: string, required: false }
              - { label: 显示顺序, name: order, widget: number, value_type: int, hint: 数字越小越靠前。 }
              - { label: 显示, name: visible, widget: boolean, default: true }
